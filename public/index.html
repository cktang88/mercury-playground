<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Mercury 2.5 Playground</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app-container">
    <main class="conversation-pane">
      <header class="chat-header">
        <h1>Mercury 2.5</h1>
        <p class="model-info">Diffusion LLM • <span id="connection-status">checking...</span></p>
      </header>

      <div id="chat-output" class="chat-output"></div>

      <div class="input-area">
        <div class="input-wrapper">
          <textarea id="user-input" placeholder="Type your message..." rows="1"></textarea>
          <button id="send-btn" class="send-btn" disabled>Send</button>
        </div>
        <div class="input-hints">
          <span>Enter to send</span>
          <span>Shift+Enter for newline</span>
        </div>
      </div>
    </main>

    <aside class="context-pane">
      <div class="context-card">
        <h3>API Status</h3>
        <div id="status-indicator" class="status-indicator">
          <span class="status-dot"></span>
          <span class="status-text">Checking...</span>
        </div>
      </div>

      <div class="context-card">
        <h3>Settings</h3>
        <div class="setting-row">
          <label for="temperature">Temperature</label>
          <input type="range" id="temperature" min="0" max="2" step="0.1" value="0.7" />
          <output id="temp-value">0.7</output>
        </div>
        <div class="setting-row">
          <label for="max-tokens">Max Tokens</label>
          <input type="number" id="max-tokens" value="2048" min="256" max="8192" />
        </div>
      </div>

      <div class="context-card">
        <h3>Usage</h3>
        <div class="usage-row">
          <span>Input tokens</span>
          <output id="input-tokens">0</output>
        </div>
        <div class="usage-row">
          <span>Output tokens</span>
          <output id="output-tokens">0</output>
        </div>
        <div class="usage-row">
          <span>Total</span>
          <output id="total-tokens">0</output>
        </div>
      </div>

    </aside>
  </div>
  <script src="app.js"></script>
</body>
</html>
